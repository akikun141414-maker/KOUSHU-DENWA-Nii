<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOUSHU-DENWA-Nii - Official Portfolio</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent-color: #ff2a5f;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        h1 span {
            color: var(--accent-color);
        }
        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            letter-spacing: 1px;
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .card:hover {
            border-color: var(--accent-color);
        }
        .links-grid {
            display: grid;
            gap: 12px;
        }
        .btn {
            display: block;
            background-color: #1a1a1a;
            color: var(--text-main);
            text-align: center;
            padding: 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
        footer {
            text-align: center;
            padding: 30px 0;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KOUSHU-DENWA-<span>Nii</span></h1>
            <p class="subtitle">Official Artist Portfolio</p>
        </header>

        <main>
            <div class="card">
                <h2 class="section-title">About</h2>
                <p style="color: #ccc; font-size: 0.95rem;">
                    ジャンルレスに音を紡ぐクリエイター。ダークで疾走感のあるサウンドスケープを展開中。
                </p>
            </div>

            <div class="card">
                <h2 class="section-title">Links & Music</h2>
                <div class="links-grid">
                    <a href="https://soundcloud.com" target="_blank" class="btn">SoundCloud</a>
                    <a href="https://x.com" target="_blank" class="btn">X (Twitter)</a>
                    <a href="https://tiktok.com" target="_blank" class="btn">TikTok</a>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; KOUSHU-DENWA-Nii All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
